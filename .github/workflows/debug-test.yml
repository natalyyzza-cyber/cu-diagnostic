name: Debug syntax
on:
  push:
    branches: ["claude/urban-projects-diagnostic-f96myi"]
jobs:
  syntax:
    strategy:
      fail-fast: false
      matrix:
        file: ["src/scoring.js","src/ai.js","public/js/questions.js"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check ${{ matrix.file }}
