name: Debug test output
on:
  push:
    branches: ["claude/urban-projects-diagnostic-f96myi"]
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Run tests and publish output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set +e
          npm test > /tmp/test.log 2>&1
          code=$?
          text="$(tail -c 12000 /tmp/test.log | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')"
          gh api --method POST "/repos/$GH_REPO/check-runs" \
            -f name="Diagnostic test output" \
            -f head_sha="$SHA" \
            -f status="completed" \
            -f conclusion="neutral" \
            -f output[title]="npm test output" \
            -f output[summary]="See detailed test output below" \
            -f output[text]="$text"
          exit $code
