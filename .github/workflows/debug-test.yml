name: Debug test output
on:
  push:
    branches: ["claude/urban-projects-diagnostic-f96myi"]
jobs:
  debug:
    if: ${{ !contains(github.event.head_commit.message, 'debug: capture test output') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Capture test output
        run: |
          set +e
          npm test > debug-output.txt 2>&1
          echo $? > debug-exit.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add debug-output.txt debug-exit.txt
          git commit -m "debug: capture test output"
          git push
